<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一剑封天 - GM管理后台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: #1a1a2e; color: #eee; }

        /* 顶部导航 */
        .header {
            background: linear-gradient(135deg, #16213e, #0f3460);
            padding: 16px 32px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #e94560;
        }
        .header h1 { font-size: 22px; color: #e94560; }
        .header .user-info { font-size: 14px; color: #aaa; }
        .header .user-info button {
            margin-left: 12px; padding: 6px 16px; background: #e94560;
            color: #fff; border: none; border-radius: 4px; cursor: pointer;
        }

        /* 布局 */
        .container { display: flex; min-height: calc(100vh - 60px); }
        .sidebar {
            width: 220px; background: #16213e; padding: 20px 0;
            border-right: 1px solid #333;
        }
        .sidebar .menu-item {
            padding: 12px 24px; cursor: pointer; font-size: 14px;
            transition: all 0.2s; border-left: 3px solid transparent;
        }
        .sidebar .menu-item:hover, .sidebar .menu-item.active {
            background: #0f3460; border-left-color: #e94560; color: #e94560;
        }
        .main { flex: 1; padding: 24px; overflow-y: auto; }

        /* 卡片 */
        .card {
            background: #16213e; border-radius: 8px; padding: 20px;
            margin-bottom: 20px; border: 1px solid #333;
        }
        .card h3 { color: #e94560; margin-bottom: 16px; font-size: 16px; }

        /* 数据看板 */
        .dashboard-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: linear-gradient(135deg, #0f3460, #16213e);
            border-radius: 8px; padding: 20px; text-align: center;
            border: 1px solid #333;
        }
        .stat-card .value { font-size: 28px; font-weight: bold; color: #e94560; }
        .stat-card .label { font-size: 13px; color: #888; margin-top: 8px; }

        /* 表格 */
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #333; }
        th { background: #0f3460; color: #e94560; font-weight: 600; }
        tr:hover { background: rgba(233,69,96,0.05); }

        /* 表单 */
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; color: #aaa; margin-bottom: 4px; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 8px 12px; background: #1a1a2e; border: 1px solid #444;
            border-radius: 4px; color: #eee; font-size: 13px;
        }
        .form-group textarea { min-height: 80px; resize: vertical; }
        .form-row { display: flex; gap: 12px; }
        .form-row .form-group { flex: 1; }

        /* 按钮 */
        .btn {
            padding: 8px 20px; border: none; border-radius: 4px; cursor: pointer;
            font-size: 13px; transition: all 0.2s;
        }
        .btn-primary { background: #e94560; color: #fff; }
        .btn-primary:hover { background: #c73e54; }
        .btn-warning { background: #f0a500; color: #1a1a2e; }
        .btn-danger { background: #d32f2f; color: #fff; }
        .btn-success { background: #388e3c; color: #fff; }
        .btn-sm { padding: 4px 12px; font-size: 12px; }

        /* 状态标签 */
        .tag { padding: 2px 8px; border-radius: 3px; font-size: 11px; }
        .tag-normal { background: #388e3c; color: #fff; }
        .tag-banned { background: #d32f2f; color: #fff; }
        .tag-muted { background: #f0a500; color: #1a1a2e; }

        /* 搜索栏 */
        .search-bar {
            display: flex; gap: 12px; margin-bottom: 16px; align-items: flex-end;
        }
        .search-bar .form-group { margin-bottom: 0; }

        /* 弹窗 */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: #16213e; border-radius: 8px; padding: 24px;
            min-width: 480px; max-width: 600px; border: 1px solid #e94560;
        }
        .modal h3 { color: #e94560; margin-bottom: 16px; }
        .modal .btn-row { display: flex; gap: 12px; justify-content: flex-end; margin-top: 16px; }

        /* 登录页 */
        .login-page {
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background: linear-gradient(135deg, #1a1a2e, #16213e);
        }
        .login-box {
            background: #16213e; padding: 40px; border-radius: 12px;
            border: 1px solid #e94560; width: 380px; text-align: center;
        }
        .login-box h2 { color: #e94560; margin-bottom: 24px; }
        .login-box .btn { width: 100%; margin-top: 8px; padding: 10px; }

        .hidden { display: none !important; }
        .page-section { display: none; }
        .page-section.active { display: block; }

        /* 分页 */
        .pagination { display: flex; gap: 8px; justify-content: center; margin-top: 16px; }
        .pagination button { padding: 6px 12px; }
    </style>
</head>
<body>

<!-- ========== 登录页 ========== -->
<div id="loginPage" class="login-page">
    <div class="login-box">
        <h2>⚔️ 一剑封天 GM后台</h2>
        <div class="form-group">
            <input type="text" id="loginUser" placeholder="管理员账号">
        </div>
        <div class="form-group">
            <input type="password" id="loginPass" placeholder="密码">
        </div>
        <button class="btn btn-primary" onclick="doLogin()">登 录</button>
        <p id="loginMsg" style="color:#e94560;margin-top:12px;font-size:13px;"></p>
    </div>
</div>

<!-- ========== 主界面 ========== -->
<div id="mainApp" class="hidden">
    <div class="header">
        <h1>⚔️ 一剑封天 · GM管理后台</h1>
        <div class="user-info">
            当前用户：<span id="currentGM">admin</span>
            <button onclick="doLogout()">退出登录</button>
        </div>
    </div>

    <div class="container">
        <!-- 侧边栏 -->
        <div class="sidebar">
            <div class="menu-item active" data-page="dashboard">📊 数据看板</div>
            <div class="menu-item" data-page="player">👤 玩家管理</div>
            <div class="menu-item" data-page="mail">📧 邮件发放</div>
            <div class="menu-item" data-page="recharge">💰 充值记录</div>
            <div class="menu-item" data-page="announcement">📢 公告管理</div>
            <div class="menu-item" data-page="log">📋 操作日志</div>
        </div>

        <!-- 主内容区 -->
        <div class="main">

            <!-- 数据看板 -->
            <div id="page-dashboard" class="page-section active">
                <div class="dashboard-grid">
                    <div class="stat-card">
                        <div class="value" id="statTotal">-</div>
                        <div class="label">总注册玩家</div>
                    </div>
                    <div class="stat-card">
                        <div class="value" id="statOnline">-</div>
                        <div class="label">今日活跃</div>
                    </div>
                    <div class="stat-card">
                        <div class="value" id="statRecharge">-</div>
                        <div class="label">累计充值（元）</div>
                    </div>
                    <div class="stat-card">
                        <div class="value" id="statBanned">-</div>
                        <div class="label">封禁玩家</div>
                    </div>
                </div>
            </div>

            <!-- 玩家管理 -->
            <div id="page-player" class="page-section">
                <div class="card">
                    <h3>🔍 玩家查询</h3>
                    <div class="search-bar">
                        <div class="form-group">
                            <label>UID / 昵称</label>
                            <input type="text" id="searchKeyword" placeholder="输入UID或昵称">
                        </div>
                        <div class="form-group">
                            <label>服务器</label>
                            <select id="searchServer">
                                <option value="">全部</option>
                                <option value="1">1服 - 青云</option>
                                <option value="2">2服 - 蓬莱</option>
                                <option value="3">3服 - 昆仑</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>状态</label>
                            <select id="searchStatus">
                                <option value="">全部</option>
                                <option value="normal">正常</option>
                                <option value="banned">封禁</option>
                                <option value="muted">禁言</option>
                            </select>
                        </div>
                        <button class="btn btn-primary" onclick="searchPlayers()">搜索</button>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>UID</th><th>昵称</th><th>职业</th><th>等级</th>
                                <th>VIP</th><th>战力</th><th>灵玉</th><th>状态</th><th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="playerTableBody">
                            <tr><td colspan="9" style="text-align:center;color:#666;">暂无数据</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 邮件发放 -->
            <div id="page-mail" class="page-section">
                <div class="card">
                    <h3>📧 发送邮件</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label>收件人UID（输入 * 为全服发送）</label>
                            <input type="text" id="mailReceiver" placeholder="玩家UID 或 *">
                        </div>
                        <div class="form-group">
                            <label>邮件标题</label>
                            <input type="text" id="mailTitle" placeholder="例：补偿邮件">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>邮件内容</label>
                        <textarea id="mailContent" placeholder="请输入邮件正文..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>附件（JSON格式）</label>
                        <textarea id="mailAttachments" placeholder='[{"item_id":1001,"name":"灵玉","count":500}]'></textarea>
                    </div>
                    <button class="btn btn-primary" onclick="sendMail()">发送</button>
                    <button class="btn btn-warning" onclick="document.getElementById('mailReceiver').value='*'">切换全服</button>
                </div>
            </div>

            <!-- 充值记录 -->
            <div id="page-recharge" class="page-section">
                <div class="card">
                    <h3>💰 充值记录</h3>
                    <div class="search-bar">
                        <div class="form-group">
                            <label>玩家UID</label>
                            <input type="text" id="rechargeUID" placeholder="输入UID查询">
                        </div>
                        <button class="btn btn-primary" onclick="searchRecharge()">查询</button>
                    </div>
                    <table>
                        <thead>
                            <tr><th>订单号</th><th>玩家UID</th><th>金额</th><th>灵玉</th><th>商品</th><th>状态</th><th>时间</th></tr>
                        </thead>
                        <tbody id="rechargeTableBody">
                            <tr><td colspan="7" style="text-align:center;color:#666;">暂无数据</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 公告管理 -->
            <div id="page-announcement" class="page-section">
                <div class="card">
                    <h3>📢 发布公告</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label>公告标题</label>
                            <input type="text" id="annTitle" placeholder="公告标题">
                        </div>
                        <div class="form-group">
                            <label>类型</label>
                            <select id="annType">
                                <option value="normal">普通公告</option>
                                <option value="maintenance">维护公告</option>
                                <option value="activity">活动公告</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>公告内容</label>
                        <textarea id="annContent" placeholder="公告正文..."></textarea>
                    </div>
                    <button class="btn btn-primary" onclick="createAnnouncement()">发布</button>
                </div>
            </div>

            <!-- 操作日志 -->
            <div id="page-log" class="page-section">
                <div class="card">
                    <h3>📋 GM操作日志</h3>
                    <table>
                        <thead>
                            <tr><th>时间</th><th>GM</th><th>操作</th><th>目标UID</th><th>详情</th><th>IP</th></tr>
                        </thead>
                        <tbody id="logTableBody">
                            <tr><td colspan="6" style="text-align:center;color:#666;">暂无数据</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- ========== 玩家操作弹窗 ========== -->
<div id="playerModal" class="modal-overlay">
    <div class="modal">
        <h3>⚙️ 玩家操作 - <span id="modalPlayerUID"></span></h3>
        <div class="form-row">
            <div class="form-group">
                <label>灵玉</label>
                <input type="number" id="modDiamond" placeholder="设置灵玉数量">
            </div>
            <div class="form-group">
                <label>金币</label>
                <input type="number" id="modGold" placeholder="设置金币数量">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>等级</label>
                <input type="number" id="modLevel" placeholder="设置等级">
            </div>
            <div class="form-group">
                <label>VIP等级</label>
                <input type="number" id="modVIP" placeholder="0-21">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>战力</label>
                <input type="number" id="modCombat" placeholder="设置战力">
            </div>
        </div>
        <div class="btn-row">
            <button class="btn btn-primary" onclick="submitModify()">确认修改</button>
            <button class="btn btn-danger" onclick="closeModal()">取消</button>
        </div>
    </div>
</div>

<script>
const API = '';  // 同源部署留空，跨域填后端地址

// ========== 通用请求 ==========
async function api(path, method = 'GET', body = null) {
    const opts = { method, headers: { 'Content-Type': 'application/json' }, credentials: 'include' };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(API + path, opts);
    return res.json();
}

// ========== 登录/登出 ==========
async function doLogin() {
    const username = document.getElementById('loginUser').value;
    const password = document.getElementById('loginPass').value;
    const data = await api('/api/login', 'POST', { username, password });
    if (data.code === 0) {
        document.getElementById('loginPage').classList.add('hidden');
        document.getElementById('mainApp').classList.remove('hidden');
        document.getElementById('currentGM').textContent = username;
        loadDashboard();
    } else {
        document.getElementById('loginMsg').textContent = data.msg;
    }
}

async function doLogout() {
    await api('/api/logout', 'POST');
    location.reload();
}

// ========== 侧边栏切换 ==========
document.querySelectorAll('.sidebar .menu-item').forEach(item => {
    item.addEventListener('click', () => {
        document.querySelectorAll('.sidebar .menu-item').forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        const page = item.dataset.page;
        document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
        document.getElementById('page-' + page).classList.add('active');
        if (page === 'dashboard') loadDashboard();
        if (page === 'log') loadLogs();
    });
});

// ========== 数据看板 ==========
async function loadDashboard() {
    const data = await api('/api/dashboard');
    if (data.code === 0) {
        document.getElementById('statTotal').textContent = data.data.total_players;
        document.getElementById('statOnline').textContent = data.data.online_today;
        document.getElementById('statRecharge').textContent = data.data.total_recharge;
        document.getElementById('statBanned').textContent = data.data.banned_count;
    }
}

// ========== 玩家搜索 ==========
async function searchPlayers() {
    const keyword = document.getElementById('searchKeyword').value;
    const server = document.getElementById('searchServer').value;
    const status = document.getElementById('searchStatus').value;
    let url = `/api/player/list?keyword=${keyword}&server_id=${server}&status=${status}`;
    const data = await api(url);
    const tbody = document.getElementById('playerTableBody');
    if (data.code === 0 && data.data.list.length > 0) {
        tbody.innerHTML = data.data.list.map(p => `
            <tr>
                <td>${p.player_uid}</td>
                <td>${p.nickname}</td>
                <td>${p.职业 || '-'}</td>
                <td>${p.level}</td>
                <td>VIP${p.vip_level}</td>
                <td>${p.combat_power}</td>
                <td>${p.diamond}</td>
                <td><span class="tag tag-${p.status}">${p.status === 'normal' ? '正常' : p.status === 'banned' ? '封禁' : '禁言'}</span></td>
                <td>
                    <button class="btn btn-primary btn-sm" onclick="openModifyModal('${p.player_uid}')">修改</button>
                    <button class="btn btn-danger btn-sm" onclick="banPlayer('${p.player_uid}')">封号</button>
                </td>
            </tr>
        `).join('');
    } else {
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:#666;">未找到玩家</td></tr>';
    }
}

// ========== 修改玩家弹窗 ==========
let currentModifyUID = '';
function openModifyModal(uid) {
    currentModifyUID = uid;
    document.getElementById('modalPlayerUID').textContent = uid;
    document.getElementById('playerModal').classList.add('show');
}
function closeModal() {
    document.getElementById('playerModal').classList.remove('show');
}
async function submitModify() {
    const modifications = {};
    const d = document.getElementById('modDiamond').value;
    const g = document.getElementById('modGold').value;
    const l = document.getElementById('modLevel').value;
    const v = document.getElementById('modVIP').value;
    const c = document.getElementById('modCombat').value;
    if (d) modifications.diamond = d;
    if (g) modifications.gold = g;
    if (l) modifications.level = l;
    if (v) modifications.vip_level = v;
    if (c) modifications.combat_power = c;
    const data = await api('/api/gm/modify_player', 'POST', { player_uid: currentModifyUID, modifications });
    alert(data.msg);
    closeModal();
    searchPlayers();
}

// ========== 封号 ==========
async function banPlayer(uid) {
    const reason = prompt('请输入封号原因：');
    if (!reason) return;
    const data = await api('/api/gm/ban_player', 'POST', {
        player_uid: uid, action_type: 'ban', reason, duration_hours: 0
    });
    alert(data.msg);
    searchPlayers();
}

// ========== 发送邮件 ==========
async function sendMail() {
    const receiver_uid = document.getElementById('mailReceiver').value;
    const title = document.getElementById('mailTitle').value;
    const content = document.getElementById('mailContent').value;
    let attachments = [];
    try {
        const raw = document.getElementById('mailAttachments').value;
        if (raw) attachments = JSON.parse(raw);
    } catch (e) { alert('附件JSON格式错误'); return; }
    const data = await api('/api/gm/send_mail', 'POST', { receiver_uid, title, content, attachments });
    alert(data.msg);
}

// ========== 充值记录 ==========
async function searchRecharge() {
    const uid = document.getElementById('rechargeUID').value;
    const data = await api(`/api/recharge/list?player_uid=${uid}`);
    const tbody = document.getElementById('rechargeTableBody');
    if (data.code === 0 && data.data.list.length > 0) {
        tbody.innerHTML = data.data.list.map(r => `
            <tr>
                <td>${r.order_id}</td><td>${r.player_uid}</td>
                <td>¥${r.amount}</td><td>${r.diamond_added}</td>
                <td>${r.product_name || '-'}</td>
                <td>${r.status}</td><td>${r.created_at}</td>
            </tr>
        `).join('');
    } else {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#666;">暂无记录</td></tr>';
    }
}

// ========== 公告 ==========
async function createAnnouncement() {
    const title = document.getElementById('annTitle').value;
    const content = document.getElementById('annContent').value;
    const announce_type = document.getElementById('annType').value;
    const data = await api('/api/announcement/create', 'POST', { title, content, announce_type });
    alert(data.msg);
}

// ========== 操作日志 ==========
async function loadLogs() {
    const data = await api('/api/log/list');
    const tbody = document.getElementById('logTableBody');
    if (data.code === 0 && data.data.list.length > 0) {
        tbody.innerHTML = data.data.list.map(l => `
            <tr>
                <td>${l.created_at}</td><td>${l.gm_user}</td>
                <td>${l.action}</td><td>${l.target_uid || '-'}</td>
                <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;">${l.detail || '-'}</td>
                <td>${l.ip_address || '-'}</td>
            </tr>
        `).join('');
    } else {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#666;">暂无日志</td></tr>';
    }
}
</script>
</body>
</html>
